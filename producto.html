<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <header>
       <header class="header">
    <div class="header__logo">
      <a href="index.html" class="header__logo-link">
        <img src="images/logo.svg" alt="logo" class="header__logo-image" />
      </a>
    </div>
    <nav class="header__nav">
      <ul class="header__nav-list">
        <li class="header__nav-item">
          <a href="index.html" class="header__nav-link">Inicio</a>
        </li>
        <li class="header__nav-item">
          <a href="quienes-somos.html" class="header__nav-link">Quienes somos</a>
        </li>
      </ul>
    </nav>
     <div class="header__carrito">
      <a class="btn-cart" href="#">
        <img src="images/bag.svg" alt="carrito" class="header__carrito" />
      </a>
       <span class="menu-quantity">1</span>
        <a href="#" class="clear btn-clean"><img src="images/trash.svg"></a>
    </div>
  </header>
      <main>
     <div class="cart">
          <div class="cart-content">
           <a class="close-cart" href="#"> <img src="images/close.svg" alt="close"></a>
          <h3>Carrito</h3>
          <div class="cart-product-list">

           
             
          </div>

            <div class="cart-product-price-sum">
              <p>Total <span>$25000</span></p>
            </div>
            
            <div class="cart-content-button">
            <a href="#" class="btn">Realizar compra</a>
            <a href="#" class="btn btn-gray">Eliminar todo</a>
           </div>
          </div>
        </div>
        
    <section>
      <div class="single-product__container">
        <div class="single-product">
            <div class="single-product__image">
                <img class="img" src="" alt="" />
            </div>
            <div class="single-product__content">
            <h1></h1>
            <h4></h4>
            <p></p>
          <span>Cantidad:</span>
          <input class="quantity" type="number" min="1" step="1" value="1"/>
            </div>
        </div>
      </div>
    </section>
    </main>
    <footer class="footer">
    <div class="footer__content">
      <img class="footer__logo" src="images/logo.svg" alt="logo" />
      <p class="footer__text">Todos los derechos reservados.</p>
    </div>
  </footer>
    <script src="js/funciones.js"></script>
    <script src="js/producto.js"></script>
  
  </body>
</html>
